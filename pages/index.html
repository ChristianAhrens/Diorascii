<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diorascii - animated ASCII scenes for your terminal: an aquarium, a forest, the moon and more. One small binary, no dependencies.">
  <meta property="og:title" content="Diorascii">
  <meta property="og:description" content="Animated ASCII scenes for your terminal: an aquarium, a forest, the moon and more.">
  <meta property="og:type" content="website">
  <title>Diorascii</title>
  <style>
    :root {
      --bg:          #060b17;
      --surface:     #101826;
      --surface-2:   #18233a;
      --border:      #2a3a57;
      --text:        #e6edf3;
      --text-muted:  #8a98ad;
      --accent:      #4cc9f0;
      --accent-dim:  #17415a;
      --accent-hover:#7fdcf7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Slowly shifting deep-water gradient: shown while the video loads, and when
       there is no video at all (the video is optional and sits on top of this). */
    .bg-fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, #060b17 0%, #0b2a45 55%, #123c52 100%);
      background-size: 100% 220%;
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift { from { background-position: 0 0; } to { background-position: 0 100%; } }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transition: opacity 0.25s;
    }
    .bg-video.swap { opacity: 0; }

    .bg-shade {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: radial-gradient(ellipse at center, rgba(6, 11, 23, 0.25) 0%, rgba(6, 11, 23, 0.7) 100%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      padding: 2.25rem 2rem 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text) 55%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: block;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #06121c;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #06121c;
    }

    .toggles {
      position: fixed;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 4;
      display: flex;
      gap: 0.5rem;
    }
    .group {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: rgba(16, 24, 38, 0.72);
      border: 1px solid var(--border);
      border-radius: 8px;
      backdrop-filter: blur(6px);
    }
    .group button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      color: var(--text-muted);
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .group button:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
    .group button[aria-pressed="true"] { color: var(--accent); background: var(--accent-dim); }
    .group button:disabled { opacity: 0.3; cursor: default; }
    .group button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .group svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    @media (prefers-reduced-motion: reduce) {
      .bg-video { display: none; }
      .bg-fallback { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg-fallback"></div>
  <video class="bg-video" id="bg" src="Resources/Diorascii_Sea_Day.mp4" autoplay muted loop playsinline aria-hidden="true"
         onerror="this.style.display='none'"></video>
  <div class="bg-shade"></div>

  <div class="toggles">
    <div class="group" role="group" aria-label="Scene" id="scenes">
      <button type="button" data-scene="Sea" title="Aquarium" aria-label="Aquarium" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M2 12c3-5 8-6 12-3l4 3-4 3c-4 3-9 2-12-3z"/><path d="M18 12l4-4v8z"/><circle cx="7.5" cy="11" r=".6"/></svg></button>
      <button type="button" data-scene="Forest" title="Forest" aria-label="Forest" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 3l6 8h-3l4 6H5l4-6H6z"/><path d="M12 17v4"/></svg></button>
      <button type="button" data-scene="Desert" title="Desert" aria-label="Desert" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 21c0-6 0-9-1-13"/><path d="M11 8C8 5 5 6 3 9c3-1 5 0 8 3M11 8c1-4 4-5 8-3-3 0-5 1-6 4M11 8c3-1 7 1 8 5-3-2-5-2-8-1M11 8C8 8 5 10 4 14c2-2 4-3 7-3"/></svg></button>
      <button type="button" data-scene="Moon" title="Moon" aria-label="Moon" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></button>
    </div>
    <div class="group" role="group" aria-label="Time of day" id="times">
      <button type="button" data-time="Day" title="Day" aria-label="Day" aria-pressed="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-time="Night" title="Night" aria-label="Night" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </div>
  </div>

  <main>
    <div class="panel">
      <h1>Diorascii</h1>
      <p class="tagline">Animated ASCII scenes for your terminal &mdash; an aquarium, a forest, the moon and more</p>
      <div class="buttons">
        <a class="btn btn-primary" href="https://github.com/ChristianAhrens/Diorascii/releases/latest">Latest Release</a>
        <a class="btn" href="https://github.com/ChristianAhrens/Diorascii">GitHub Repository</a>
        <a class="btn" href="doxygen/index.html">Documentation</a>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var video = document.getElementById('bg');
      var scenes = document.querySelectorAll('#scenes button');
      var times = document.querySelectorAll('#times button');
      var state = { scene: 'Sea', time: 'Day' };
      try {
        var saved = JSON.parse(localStorage.getItem('diorascii-bg') || '{}');
        if (/^(Sea|Forest|Desert|Moon)$/.test(saved.scene)) state.scene = saved.scene;
        if (/^(Day|Night)$/.test(saved.time)) state.time = saved.time;
      } catch (e) {}

      function file() {
        // The moon has no day and night: one clip serves both.
        return 'Resources/Diorascii_' + state.scene + (state.scene === 'Moon' ? '' : '_' + state.time) + '.mp4';
      }

      function apply(fade) {
        var moon = state.scene === 'Moon';
        scenes.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.scene === state.scene)); });
        times.forEach(function (b) {
          b.disabled = moon;
          b.setAttribute('aria-pressed', String(!moon && b.dataset.time === state.time));
        });
        var next = file();
        if (video.getAttribute('src') === next) return;
        var load = function () { video.src = next; video.load(); video.play().catch(function () {}); video.classList.remove('swap'); };
        video.style.display = '';
        if (fade) { video.classList.add('swap'); setTimeout(load, 250); } else { load(); }
        try { localStorage.setItem('diorascii-bg', JSON.stringify(state)); } catch (e) {}
      }

      scenes.forEach(function (b) { b.addEventListener('click', function () { state.scene = b.dataset.scene; apply(true); }); });
      times.forEach(function (b) { b.addEventListener('click', function () { state.time = b.dataset.time; apply(true); }); });
      apply(false);
    })();
  </script>
</body>
</html>
