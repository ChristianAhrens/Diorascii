<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diorascii user manual: installing and using the animated ASCII scenes for your terminal.">
  <title>$pagetitle$ - Diorascii Manual</title>
  <style>
    :root {
      --bg:          #060b17;
      --surface:     #101826;
      --surface-2:   #18233a;
      --border:      #2a3a57;
      --text:        #e6edf3;
      --text-muted:  #8a98ad;
      --accent:      #4cc9f0;
      --accent-dim:  #17415a;
      --code-bg:     #0a1120;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f8fb; --surface: #ffffff; --surface-2: #e9eff6; --border: #c9d5e3;
        --text: #14202e; --text-muted: #55657a; --accent: #0b6e99; --accent-dim: #d3e8f3; --code-bg: #eef3f8;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    .layout { display: flex; min-height: 100vh; }
    nav.side {
      flex: 0 0 15rem; padding: 1.5rem 1rem; background: var(--surface);
      border-right: 1px solid var(--border); position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto;
    }
    nav.side .brand { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); text-decoration: none; display: block; margin-bottom: 0.25rem; }
    nav.side .sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
    nav.side a.chapter { display: block; padding: 0.35rem 0.6rem; border-radius: 6px; color: var(--text); text-decoration: none; font-weight: 600; }
    nav.side a.chapter:hover { background: var(--surface-2); }
    nav.side a.chapter[aria-current="page"] { background: var(--accent-dim); color: var(--accent); }
    nav.side .back { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.9rem; }
    nav.side .back a { display: block; padding: 0.2rem 0.6rem; text-decoration: none; color: var(--text-muted); }
    nav.side .back a:hover { color: var(--accent); }
    main { flex: 1; min-width: 0; padding: 2rem 2rem 4rem; }
    article { max-width: 54rem; margin: 0 auto; }
    h1 { font-size: 2.2rem; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 1rem; }
    h2 { margin-top: 2.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    h3 { margin-top: 1.75rem; }
    img { max-width: 100%; height: auto; }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
    pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem 1rem; overflow-x: auto; line-height: 1.3; }
    pre code { background: none; padding: 0; font-size: 0.85rem; }
    table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1rem 0; }
    th, td { border: 1px solid var(--border); padding: 0.4rem 0.7rem; vertical-align: top; text-align: left; }
    th { background: var(--surface-2); }
    blockquote { margin: 1rem 0; padding: 0.1rem 1rem; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 6px 6px 0; }
    .pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    footer { margin-top: 2rem; color: var(--text-muted); font-size: 0.85rem; }
    @media (max-width: 760px) {
      .layout { flex-direction: column; }
      nav.side { position: static; height: auto; flex: none; border-right: 0; border-bottom: 1px solid var(--border); }
      main { padding: 1.25rem 1rem 3rem; }
    }
  </style>
</head>
<body>
<div class="layout">
$nav$
  <main>
    <article>
$body$
$pager$
      <footer>Diorascii $version$ &middot; MIT licensed &middot; <a href="https://github.com/ChristianAhrens/Diorascii/tree/main/docs/manual">edit this page on GitHub</a></footer>
    </article>
  </main>
</div>
</body>
</html>
