name: Release

# Triggered by pushing a version tag in the form x.y.z (major.minor.fix), without a
# "v" prefix:  git tag 1.2.3 && git push origin 1.2.3
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# contents: write lets the built-in GITHUB_TOKEN create the release and upload
# assets - no extra secret is needed.
permissions:
  contents: write

jobs:
  # The release starts as a draft so "latest release" never points at a release
  # that is still missing a platform. It is published by the last job below.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CHANGELOG.md is the source of the version and of the release text: the tag must be the
      # latest released section, and that section becomes the notes of the release.
      - name: Take the release notes from CHANGELOG.md
        run: |
          latest="$(scripts/release-notes.sh --latest)"
          if [ "$latest" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the latest released section of CHANGELOG.md ($latest). Move the Unreleased entries into a [${{ github.ref_name }}] section first."
            exit 1
          fi
          scripts/release-notes.sh "${{ github.ref_name }}" > release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" ||
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --notes-file release-notes.md
          --draft

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            preset: release-macos
          - os: ubuntu-latest
            name: Linux
            preset: release
          - os: windows-latest
            name: Windows
            preset: release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tag becomes the version reported by `diorascii --version` and used in package names.
      - name: Configure
        if: runner.os != 'macOS'
        run: cmake --preset ${{ matrix.preset }} "-DDIORASCII_VERSION=${{ github.ref_name }}"

      - name: Build
        if: runner.os != 'macOS'
        run: cmake --build build/${{ matrix.preset }} --config Release --parallel

      # Never publish a build nobody verified.
      - name: Test
        if: runner.os != 'macOS'
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure

      # (macOS configures, builds and tests inside the packaging script.)
      # The same script builds the asset on a developer's Mac with a real certificate and
      # notarization; without one it falls back to the ad-hoc signature used here.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: DIORASCII_ADHOC=1 scripts/package-macos.sh "${{ github.ref_name }}" staging

      - name: Stage release payload
        if: runner.os != 'macOS'
        run: >
          cmake --install build/${{ matrix.preset }} --config Release
          --prefix "staging/Diorascii-${{ github.ref_name }}-${{ matrix.name }}"

      - name: Package (zip)
        if: runner.os == 'Windows'
        working-directory: staging
        run: >
          Compress-Archive
          -Path "Diorascii-${{ github.ref_name }}-${{ matrix.name }}"
          -DestinationPath "Diorascii-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Package (tar.gz)
        if: runner.os == 'Linux'
        working-directory: staging
        run: tar czf "Diorascii-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" "Diorascii-${{ github.ref_name }}-${{ matrix.name }}"

      # .deb (Debian, Ubuntu) and .rpm (Fedora, openSUSE) install /usr/bin/diorascii, so it is in the
      # PATH, and the package manager upgrades and removes it. rpmbuild comes with the "rpm" package.
      - name: Package (deb, rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          cd build/${{ matrix.preset }}
          cpack -G DEB
          cpack -G RPM
          cd ../..
          cp build/${{ matrix.preset }}/diorascii*.deb "staging/Diorascii-${{ github.ref_name }}-${{ matrix.name }}.deb"
          cp build/${{ matrix.preset }}/diorascii*.rpm "staging/Diorascii-${{ github.ref_name }}-${{ matrix.name }}.rpm"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: staging
        run: |
          # Every file of this platform (the staged directory is not a file and is skipped).
          assets=()
          for f in Diorascii-${{ github.ref_name }}-${{ matrix.name }}*; do
            [ -f "$f" ] && assets+=("$f")
          done
          echo "Uploading: ${assets[*]}"
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber "${assets[@]}"

  # Only runs when every platform built, passed its tests and uploaded its asset.
  publish:
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release edit "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --draft=false
          --latest
